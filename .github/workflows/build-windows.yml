name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: starfish-control-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/starfish-control.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: starfish-control-windows-x86_64
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/starfish-control.exe

  # 每次 push 到 main 都更新一个滚动预发布版本（tag 固定为 nightly）。
  # 用 andelf/nightly-release 而不是再发正式版：它只保留最新一次构建的产物，
  # 同名资产先删后传，不会让 Releases 页面越堆越多；提交没变时
  # only-when-changed（默认 true）直接跳过。
  nightly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: starfish-control-windows-x86_64
          path: dist
      - name: Publish nightly release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'Nightly Build @ $$'
          prerelease: true
          # 让人一眼看出这个 nightly 是哪次提交编出来的。
          body: |
            由 GitHub Actions 自动构建，对应提交 `${{ github.sha }}`。

            ${{ github.event.head_commit.message }}
          files: |
            dist/starfish-control.exe
